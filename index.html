                </div>

                
            </div>


            <main>





<dialog id="popup">
    <h3>Selecione o gráfico que deseja adicionar</h3>

    <label><input type="radio" name="tipo" value="grafico-mensal" checked> Alunos por mês (linhas)</label>
    <label><input type="radio" name="tipo" value="grafico-residuos"> Resíduos por tipo (rosca)</label>
    <label><input type="radio" name="tipo" value="grafico-rpa"> Ações por RPA (barras)</label>
    <label><input type="radio" name="tipo" value="grafico-temas"> Temas mais trabalhados (barras horizontais)</label>
    <label><input type="radio" name="tipo" value="grafico-nivel"> Participação por nível de ensino (barras empilhadas)</label>

    <button id="confirmar">Confirmar</button>
    <button id="cancelar">Cancelar</button>
</dialog>














                <div class="titulo-pagina">
                    <h2>Educação ambiental em Recife</h2>
                    <p>Acompanhamento das ações nas escolas e nos bairros da cidade</p>
                </div>

                <section class="cards grid-stack">
                
                </section>

                <section id="metas">
  <h3>Metas de ações por RPA</h3>

  <div id="form-meta">
    <input type="hidden" id="meta-id">
    <select id="meta-rpa">
      <option>RPA 1</option>
      <option>RPA 2</option>
      <option>RPA 3</option>
      <option>RPA 4</option>
      <option>RPA 5</option>
      <option>RPA 6</option>
    </select>
    <input type="number" id="meta-valor" placeholder="Meta (nº de ações)" min="0">
    <input type="text" id="meta-anotacao" placeholder="Anotação sobre o indicador">
    <button id="meta-salvar">Salvar</button>
    <button id="meta-cancelar" hidden>Cancelar edição</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>RPA</th>
        <th>Meta</th>
        <th>Realizado</th>
        <th>Progresso</th>
        <th>Anotação</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="metas-tbody"></tbody>
  </table>
</section>
            </main>  

        </div>

    </div>




<script src="renderers.js"></script>
<script src="main.js"></script>
<script src="popup.js"></script>
<script src="api.js"></script>
<script src="metas.js"></script>
<script>
    let buttonDelete = document.querySelectorAll('.btn-delete');
    buttonDelete.forEach(botao => {
        botao.addEventListener("click", deleteWidget);

    })
    


    function deleteWidget(event) {
        let grid = GridStack.init();
        let widget = event.currentTarget.closest('.grid-stack-item');
        grid.removeWidget(widget);

    }

</script>
</body>
